# Docuflow web — nginx site configuration
#
# Serves the Vite build as a single-page app and proxies /api/ to the backend
# so the browser only ever talks to one origin (no CORS required).
#
# If the API is on another host, either change `proxy_pass` below or set
# VITE_API_BASE_URL at build time to the absolute API URL.

upstream docuflow_api {
    # Docker Compose service name; replace with your backend host:port.
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads through the proxy (25 MB UI limit + multipart overhead).
    client_max_body_size 32m;

    # Basic hardening. CSP is intentionally omitted because previews use
    # presigned object-storage URLs whose hosts vary per deployment.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API reverse proxy. Presigned upload/download URLs returned by the API
    # point straight at object storage and are requested directly by the
    # browser, so they do not pass through this location.
    location /api/ {
        proxy_pass http://docuflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-sent chunks from /query-stream must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fonts and other static files.
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Never cache the HTML entry point: it references hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
