# Production stack: a TLS-terminating Caddy in front of the single-page app, the
# API, the Celery worker and the backing services, all on one host.
#
#   cp .env.production.example .env.production   # then edit every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy publishes ports. Postgres, Redis, MinIO and the API stay on the
# private Docker network. The browser reaches object storage through Caddy on
# the storage hostname, which is also the host presigned URLs are signed for.
name: docuflow

services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [docuflow]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [docuflow]

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The browser fetches presigned download URLs cross-origin from here.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [docuflow]

  backend:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: [.env.production]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [docuflow]

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: [.env.production]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [docuflow]

  # Serves the built SPA and proxies /api/ to the backend on the private network.
  web:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [docuflow]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: [.env.production]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, minio]
    networks: [docuflow]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  docuflow:
    driver: bridge
